[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huntingszn-cover"
version = "0.1.0"
description = "Album cover art tool: fetch album covers via SerpAPI, transform with OpenAI image edit, create mashup composites."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Will Hunter" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "openai>=1.30",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
huntingszn-cover = "huntingszn_cover.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["huntingszn_cover"]

[tool.hatch.build.targets.wheel.force-include]
"huntingszn_cover/prompts" = "huntingszn_cover/prompts"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
