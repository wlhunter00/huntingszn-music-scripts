[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stem-split"
version = "0.1.0"
description = "Vocal ensemble + Demucs stem splitting for Ableton"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
mac = ["mlx-audio-separator>=0.1.4"]
gpu = [
    "audio-separator[gpu]>=0.20",
    "torch>=2.12",
    "torchvision>=0.27",
]
cpu = ["audio-separator>=0.20", "onnxruntime>=1.18"]

[project.scripts]
stem-split = "stem_split.__main__:main"
stem-verify = "stem_split.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["stem_split"]
