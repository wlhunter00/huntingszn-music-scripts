[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-cue"
version = "0.1.0"
description = "Automatic Serato hot-cue tagger for HuntingSzn — predicts 8 cues from audio features and beatgrid"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "huntingszn-music-scripts",
    "serato-bpm-cleanup",
    "library-tools",
    "mutagen>=1.47",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
vocals = ["demucs>=4.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
auto-cue = "auto_cue.cli:main"
auto-cue-eval = "auto_cue.eval:main"

[tool.uv.sources]
huntingszn-music-scripts = { workspace = true }
serato-bpm-cleanup = { workspace = true }
library-tools = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["auto_cue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
