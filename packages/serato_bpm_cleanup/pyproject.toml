[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serato-bpm-cleanup"
version = "0.1.0"
description = "Dry-run-first CLI to round fractional Serato BPMs without touching tracks that have cues"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "huntingszn-music-scripts",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
serato-bpm-cleanup = "serato_bpm_cleanup.cli:main"

[tool.uv.sources]
huntingszn-music-scripts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["serato_bpm_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
