[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-downloads"
version = "0.1.0"
description = "SoundCloud, YouTube, and Spotify-metadata audio downloaders"
requires-python = ">=3.11"
dependencies = [
    "huntingszn-music-scripts",
    "yt-dlp[default]>=2026.8.19",
    "spotipy>=2.23",
    "mutagen>=1.47",
]

[tool.uv.sources]
huntingszn-music-scripts = { workspace = true }

[project.scripts]
sc-dl = "downloads.soundcloud:main"
yt-dl = "downloads.youtube:main"
sp-dl = "downloads.spotify:main"

[tool.hatch.build.targets.wheel]
packages = ["downloads"]
