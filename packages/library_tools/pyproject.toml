[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "library-tools"
version = "0.1.0"
description = "DJ library metadata, duplicates, Platinum Notes cleanup, key correction"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
key-correction = ["spotipy>=2.23", "pandas>=2.0"]

[project.scripts]
pn-rename = "library_tools.pn_rename:main"
library-metadata = "library_tools.metadata:main"
library-dedupe = "library_tools.duplicate:main"
key-correct-catalog = "library_tools.key_correction.step1_catalog:main"

[tool.hatch.build.targets.wheel]
packages = ["library_tools"]
