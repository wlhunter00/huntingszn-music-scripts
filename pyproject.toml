[project]
name = "huntingszn-music-scripts"
version = "0.2.0"
description = "HuntingSzn Music Scripts — monorepo for DJ and production tooling"
requires-python = ">=3.11"
readme = "README.md"

[tool.uv.workspace]
members = [
    "packages/music_script",
    "packages/stem_split",
    "packages/library_tools",
    "packages/downloads",
    "packages/catalogs",
    "packages/soundcloud_repost",
    "packages/gpt_trainer",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
