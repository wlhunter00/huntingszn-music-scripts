[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huntingszn-music-scripts"
version = "0.2.0"
description = "HuntingSzn Music Scripts — monorepo for DJ and production tooling"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config"]

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "packages/mashup_pop_finder",
    "packages/stem_split",
    "packages/library_tools",
    "packages/downloads",
    "packages/catalogs",
    "packages/soundcloud_repost",
    "packages/gpt_trainer",
    "packages/huntingszn_cover",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

# Windows stem-split: PyPI ships CPU-only torch; use CUDA wheels from PyTorch.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
